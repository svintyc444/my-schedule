name: Update Schedule

on:
  schedule:
    # Запуск каждый день в 04:00 утра по МСК (01:00 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch: # Позволяет запускать вручную кнопкой в GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка библиотек
        run: pip install -r requirements.txt

      - name: Парсинг расписания
        run: python parser.py

      - name: Сохранение и пуш файла в репозиторий
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.ics
          git commit -m "Auto-update schedule.ics [skip ci]" || exit 0
          git push
